[package]
name = "swcraft-scan"
description = "Read-only batch checker for 3D/CAD files (can ModelCraft open them?)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sw-format = { path = "../sw-format" }
craft-formats = { path = "../craft-formats" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[features]
default = []
occt = ["craft-formats/occt"]
