[package]
name = "craft-formats"
description = "Readers for 3D formats (STL, OBJ, 3DS, 3DXML, STEP/IGES via OpenCascade) producing sw_format::Scene"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# STEP / IGES through a small C++ shim over a static OpenCascade build (OCCT_DIR must point to it).
occt = ["dep:cc"]
# FBX, glTF, COLLADA, 3MF, PLY, IFC, X3D, USD… through a static assimp build (ASSIMP_DIR).
assimp = ["dep:cc"]
# IFC 2x3 / 4 / 4x3 through a static web-ifc build (WEBIFC_SRC / WEBIFC_BUILD).
ifc = ["dep:cc"]

[dependencies]
sw-format = { path = "../sw-format" }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
flate2 = "1"
cfb = "0.15"
glam = "0.30"

[build-dependencies]
cc = { version = "1", optional = true }
