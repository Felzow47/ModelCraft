[package]
name = "swcraft"
description = "ModelCraft — visionneuse 3D rapide (SolidWorks, STEP, IGES, STL, OBJ, 3DS, 3DXML)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "modelcraft"
path = "src/main.rs"

[dependencies]
sw-format = { path = "../sw-format" }
craft-formats = { path = "../craft-formats" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = { version = "0.37", default-features = false }
egui-wgpu = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[features]
default = []
occt = ["craft-formats/occt"]
