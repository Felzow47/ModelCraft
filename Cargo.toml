[workspace]
resolver = "2"
members = ["crates/sw-format", "crates/craft-formats", "crates/swcraft", "crates/swcraft-scan"]

[workspace.package]
version = "0.4.30"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# egui-wgpu 0.37.0 with its panic on a refused staging buffer turned into a skipped frame
egui-wgpu = { path = "vendor/egui-wgpu" }
