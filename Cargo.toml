[workspace]
resolver = "2"
members = ["crates/sw-format", "crates/craft-formats", "crates/swcraft", "crates/swcraft-scan"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
